{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link id="favicon" rel="icon" sizes="32x32" type="image/png" href="{% static 'images/favicon32.png' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/reg.css' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Flow+Circular&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="{% static 'js/reg.js' %}" defer='defer'></script>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button id="form-submit-button" type="submit">Register</button>
  </form>
</body>
</html>
