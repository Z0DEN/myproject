{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/reg.css' %}">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="{% static 'js/reg.js' %}" defer='defer'></script>
</head>
<body>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <span>
       <img src="https://cdn-icons-png.flaticon.com/512/5290/5290058.png" alt="" id="checkbox">
    </span>
    <span>
       <img src="https://secretfit-food.ru/wp-content/uploads/2019/10/close.png" alt="" id="cross">
    </span>
    <button type="submit">Register</button>
  </form>
</body>
</html>
