events {
    worker_connections  1024;
}

http {
    include         /etc/nginx/mime.types;
    include         /etc/nginx/conf.d/*.conf;

    # https://github.com/google/ngx_brotli
    brotli_static   on;
    brotli          on;

    # http://nginx.org/en/docs/http/ngx_http_gzip_module.html
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;

    server {
        listen 80;
        server_name cloudblesk.site;

        # Add Alt-Svc header to negotiate HTTP/3.
        add_header alt-svc 'h3-27=":443"; ma=86400, h3-28=":443"; ma=86400, h3-29=":443"; ma=86400, h3=":443"; ma=86400';

        return 301 https://$host$request_uri;

    }

    server {
        # https://github.com/cloudflare/quiche/tree/master/extras/nginx
        # Enable QUIC and HTTP/3.
        listen 443 quic reuseport;

        # Enable HTTP/2 (optional).
        listen 443 ssl http2;

        server_name cloudblesk.site;
        root /myproject/nginx_files/www;
        index index.html index.php index.xml;

        ssl_certificate /myproject/nginx_files/certs/fullchain.pem;
        ssl_certificate_key /myproject/tnginx_files/certs/privkey.pem;
        ssl_trusted_certificate /myproject/nginx_files/certs/chain.pem;

        include /myproject/nginx_files/snippets/ssl-params.conf;

        location / {
                proxy_pass http://127.0.0.1:8001/;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                proxy_cookie_domain $host https://cloudblesk.site;
                proxy_cookie_flags ~ secure;
        }

        ssl_early_data on;

        #proxy_set_header Early-Data $ssl_early_data;

        if ($host != "cloudblesk.site") {
                return 404;
        }

        # Add Alt-Svc header to negotiate HTTP/3.
        add_header alt-svc 'h3=":443"; ma=86400';

    }
}
