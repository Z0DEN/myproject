[supervisord]
nodaemon=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=false
autorestart=false

[program:pull]
command=./myproject/nginx_files/conf/pull.sh
autostart=true
autorestart=false

[program:django]
command=python3 /myproject/manage.py runserver 0.0.0.0:8001
autostart=false
autorestart=false

user=root
